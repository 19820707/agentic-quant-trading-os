name: CI Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-audit:
    name: Scaffold audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run scaffold audit
        run: python scripts/scaffold_audit.py
      - name: Run scaffold audit unit tests
        run: python -m unittest discover -s tests -p "test_scaffold_audit.py"

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run core contract schema tests
        run: python -m unittest discover -s tests -p "test_core_contract_schemas.py"
      - name: Run contract validator tests
        run: python -m unittest discover -s tests -p "test_contract_validator.py"
      - name: Run contract registry tests
        run: python -m unittest discover -s tests -p "test_contract_registry.py"
      - name: Run contract fixture tests
        run: python -m unittest discover -s tests -p "test_contract_fixtures.py"
      - name: Run prediction research contract tests
        run: python -m unittest discover -s tests -p "test_prediction_research_contracts.py"
      - name: Run prediction research fake graph tests
        run: python -m unittest discover -s tests -p "test_prediction_research_fake_graph.py"
      - name: Run feature store approval gate tests
        run: python -m unittest discover -s tests -p "test_feature_store_approval_gate.py"
      - name: Run fake offline materialization review tests
        run: python -m unittest discover -s tests -p "test_fake_offline_materialization_review.py"
      - name: Run agentic self-programming governance tests
        run: python -m unittest discover -s tests -p "test_agentic_self_programming_governance.py"
      - name: Run autonomous sprint manager tests
        run: python -m unittest discover -s tests -p "test_autonomous_sprint_manager.py"
      - name: Run deep learning loop planner tests
        run: python -m unittest discover -s tests -p "test_deep_learning_loop_planner.py"
      - name: Run cognitive autonomy tests
        run: python -m unittest discover -s tests -p "test_cognitive_autonomy.py"
      - name: Run advanced cognitive autonomy tests
        run: python -m unittest discover -s tests -p "test_cognitive_autonomy_advanced.py"
      - name: Run persistence discipline tests
        run: python -m unittest discover -s tests -p "test_persistence_discipline.py"
      - name: Run loop engineering tests
        run: python -m unittest discover -s tests -p "test_loop_engineering.py"
      - name: Run agentic evidence contract tests
        run: python -m unittest discover -s tests -p "test_agentic_evidence_contracts.py"
      - name: Run agent PR review and human approval contract tests
        run: python -m unittest discover -s tests -p "test_agent_pr_review_human_approval_contracts.py"
      - name: Run trading runtime activation gate tests
        run: python -m unittest discover -s tests -p "test_trading_runtime_activation_gate.py"
      - name: Run backtest review contract tests
        run: python -m unittest discover -s tests -p "test_backtest_review_contract.py"

  adapter-interface-tests:
    name: Adapter interface tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run market data adapter interface tests
        run: python -m unittest discover -s tests -p "test_market_data_adapter_interfaces.py"
      - name: Run market data layer tests
        run: python -m unittest discover -s tests -p "test_market_data_layer.py"
      - name: Run market data adapter registry tests
        run: python -m unittest discover -s tests -p "test_market_data_adapter_registry.py"
      - name: Run in-memory market data adapter tests
        run: python -m unittest discover -s tests -p "test_in_memory_market_data_adapter.py"

  security-policy-tests:
    name: Security policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
