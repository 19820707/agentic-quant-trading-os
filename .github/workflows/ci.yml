      - name: Run agent runtime approval gate tests
        run: python -m unittest discover -s tests -p "test_agent_runtime_approval_gate.py"
      - name: Run Ruflo reference review tests
        run: python -m unittest discover -s tests -p "test_ruflo_reference_review.py"
      - name: Run control plane dashboard scaffold tests
        run: python -m unittest discover -s tests -p "test_control_plane_dashboard_scaffold.py"
      - name: Run configuration safety tests
        run: python -m unittest discover -s tests -p "test_config_settings.py"
      - name: Run domain model tests
        run: python -m unittest discover -s tests -p "test_domain_models.py"
      - name: Run OMS state machine tests
        run: python -m unittest discover -s tests -p "test_oms_state_machine.py"
      - name: Run portfolio accounting tests
        run: python -m unittest discover -s tests -p "test_portfolio_accounting.py"
      - name: Run risk evaluator tests
        run: python -m unittest discover -s tests -p "test_risk_evaluator.py"
      - name: Run strategy engine tests
        run: python -m unittest discover -s tests -p "test_strategy_engine.py"
      - name: Run paper trading simulator tests
        run: python -m unittest discover -s tests -p "test_paper_trading_simulator.py"
      - name: Run paper account state tests
        run: python -m unittest discover -s tests -p "test_paper_account_state.py"
      - name: Run backtesting engine tests
        run: python -m unittest discover -s tests -p "test_backtesting_engine.py"
      - name: Run local observability tests
        run: python -m unittest discover -s tests -p "test_observability_local.py"
      - name: Run local evidence journal tests
        run: python -m unittest discover -s tests -p "test_observability_evidence_journal.py"
      - name: Run local evidence summary tests
        run: python -m unittest discover -s tests -p "test_observability_evidence_summary.py"
      - name: Run local evidence quality gate tests
        run: python -m unittest discover -s tests -p "test_observability_evidence_quality_gate.py"
      - name: Run fail-closed execution adapter tests
        run: python -m unittest discover -s tests -p "test_execution_adapter_fail_closed.py"
      - name: Run control-plane API tests
        run: python -m unittest discover -s tests -p "test_control_plane_api.py"

  secret-artifact-audit:
    name: Secret and artifact hygiene audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run secret and artifact hygiene tests
        run: python -m unittest discover -s tests -p "test_secret_artifact_audit.py"
      - name: Run secret and artifact hygiene audit
        run: python scripts/secret_artifact_audit.py
