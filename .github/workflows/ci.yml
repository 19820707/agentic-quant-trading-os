name: CI Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-audit:
    name: Scaffold audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run scaffold audit
        run: python scripts/scaffold_audit.py
      - name: Run scaffold audit unit tests
        run: python -m unittest discover -s tests -p "test_scaffold_audit.py"
      - name: Run service placeholder static tests
        run: python -m unittest discover -s tests -p "test_service_placeholder_static.py"
      - name: Run CI test coverage guard tests
        run: python -m unittest discover -s tests -p "test_ci_test_coverage.py"

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run core contract schema tests
        run: python -m unittest discover -s tests -p "test_core_contract_schemas.py"
      - name: Run contract validator tests
        run: python -m unittest discover -s tests -p "test_contract_validator.py"
      - name: Run contract cross-field invariant tests
        run: python -m unittest discover -s tests -p "test_contract_invariants.py"
      - name: Run contract schema hygiene and payload limit tests
        run: python -m unittest discover -s tests -p "test_contract_schema_hygiene.py"
      - name: Run contract registry tests
        run: python -m unittest discover -s tests -p "test_contract_registry.py"
      - name: Run contract fixture tests
        run: python -m unittest discover -s tests -p "test_contract_fixtures.py"
      - name: Run prediction research contract tests
        run: python -m unittest discover -s tests -p "test_prediction_research_contracts.py"
      - name: Run prediction research fake graph tests
        run: python -m unittest discover -s tests -p "test_prediction_research_fake_graph.py"
      - name: Run feature store approval gate tests
        run: python -m unittest discover -s tests -p "test_feature_store_approval_gate.py"
      - name: Run agentic self-programming governance tests
        run: python -m unittest discover -s tests -p "test_agentic_self_programming_governance.py"
      - name: Run agentic evidence contract tests
        run: python -m unittest discover -s tests -p "test_agentic_evidence_contracts.py"
      - name: Run agent PR review and human approval contract tests
        run: python -m unittest discover -s tests -p "test_agent_pr_review_human_approval_contracts.py"

  adapter-interface-tests:
    name: Adapter interface tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run market data adapter interface tests
        run: python -m unittest discover -s tests -p "test_market_data_adapter_interfaces.py"
      - name: Run market data adapter registry tests
        run: python -m unittest discover -s tests -p "test_market_data_adapter_registry.py"
      - name: Run in-memory market data adapter tests
        run: python -m unittest discover -s tests -p "test_in_memory_market_data_adapter.py"
      - name: Run CCXT import guard tests
        run: python -m unittest discover -s tests -p "test_ccxt_import_guard.py"
      - name: Run CCXT read-only adapter tests
        run: python -m unittest discover -s tests -p "test_ccxt_readonly_adapter.py"
      - name: Run CCXT read-only adapter safety harness tests
        run: python -m unittest discover -s tests -p "test_ccxt_readonly_adapter_safety_harness.py"
      - name: Run CCXT read-only mocked integration tests
        run: python -m unittest discover -s tests -p "test_ccxt_readonly_mocked_integration.py"
      - name: Run external adapter review checklist tests
        run: python -m unittest discover -s tests -p "test_external_adapter_review_checklist.py"
      - name: Run external adapter safety policy tests
        run: python -m unittest discover -s tests -p "test_external_adapter_safety_policy.py"
      - name: Run market data point-in-time and leakage tests
        run: python -m unittest discover -s tests -p "test_market_data_point_in_time.py"
      - name: Run market data record validation tests
        run: python -m unittest discover -s tests -p "test_market_data_validation.py"

  security-policy-tests:
    name: Security policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run security tooling policy tests
        run: python -m unittest discover -s tests -p "test_security_tooling_policy.py"
      - name: Run prediction market repository audit tests
        run: python -m unittest discover -s tests -p "test_prediction_market_repo_audit.py"
      - name: Run market-edge reference review tests
        run: python -m unittest discover -s tests -p "test_market_edge_reference_review.py"
      - name: Run polymarket-skills reference review tests
        run: python -m unittest discover -s tests -p "test_polymarket_skills_reference_review.py"
      - name: Run Trading-Agent-Polymarket reference review tests
        run: python -m unittest discover -s tests -p "test_trading_agent_polymarket_reference_review.py"
      - name: Run agent runtime approval gate tests
        run: python -m unittest discover -s tests -p "test_agent_runtime_approval_gate.py"
      - name: Run Ruflo reference review tests
        run: python -m unittest discover -s tests -p "test_ruflo_reference_review.py"
      - name: Run control plane dashboard scaffold tests
        run: python -m unittest discover -s tests -p "test_control_plane_dashboard_scaffold.py"
      - name: Run security redaction tests
        run: python -m unittest discover -s tests -p "test_security_redaction.py"
      - name: Run audit payload redaction tests
        run: python -m unittest discover -s tests -p "test_redaction_audit_payloads.py"
      - name: Run audit event emitter interface tests
        run: python -m unittest discover -s tests -p "test_audit_event_emitter_interface.py"
      - name: Run architecture import boundary tests
        run: python -m unittest discover -s tests -p "test_architecture_import_boundaries.py"
      - name: Run workflow supply-chain tests
        run: python -m unittest discover -s tests -p "test_workflow_supply_chain.py"
      - name: Run Dependabot policy tests
        run: python -m unittest discover -s tests -p "test_dependabot_policy.py"

  secret-artifact-audit:
    name: Secret and artifact hygiene audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run secret and artifact hygiene tests
        run: python -m unittest discover -s tests -p "test_secret_artifact_audit.py"
      - name: Run secret and artifact hygiene audit
        run: python scripts/secret_artifact_audit.py

  full-suite:
    name: Full suite with declared dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # The other jobs run on the standard library alone, so they exercise the
      # fallback contract validator and never import the services. This job
      # installs exactly the dependencies declared in pyproject.toml, nothing
      # else, and runs everything against them.
      - name: Install dependencies declared in pyproject.toml
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > "$RUNNER_TEMP/requirements.txt"
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/requirements.txt"
      - name: Confirm the declared dependencies are importable
        run: python scripts/check_dev_environment.py
      - name: Run the full test suite
        run: python -m unittest discover -s tests -p "test_*.py"
