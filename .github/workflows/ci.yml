name: CI Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-audit:
    name: Scaffold audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run scaffold audit
        run: python scripts/scaffold_audit.py
      - name: Run scaffold audit unit tests
        run: python -m unittest discover -s tests -p "test_scaffold_audit.py"

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run core contract schema tests
        run: python -m unittest discover -s tests -p "test_core_contract_schemas.py"
      - name: Run contract validator tests
        run: python -m unittest discover -s tests -p "test_contract_validator.py"
      - name: Run contract registry tests
        run: python -m unittest discover -s tests -p "test_contract_registry.py"
      - name: Run contract fixture tests
        run: python -m unittest discover -s tests -p "test_contract_fixtures.py"
      - name: Run prediction research contract tests
        run: python -m unittest discover -s tests -p "test_prediction_research_contracts.py"

  adapter-interface-tests:
    name: Adapter interface tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run market data adapter interface tests
        run: python -m unittest discover -s tests -p "test_market_data_adapter_interfaces.py"
      - name: Run market data adapter registry tests
        run: python -m unittest discover -s tests -p "test_market_data_adapter_registry.py"
      - name: Run in-memory market data adapter tests
        run: python -m unittest discover -s tests -p "test_in_memory_market_data_adapter.py"

  security-policy-tests:
    name: Security policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run security tooling policy tests
        run: python -m unittest discover -s tests -p "test_security_tooling_policy.py"
      - name: Run prediction market repository audit tests
        run: python -m unittest discover -s tests -p "test_prediction_market_repo_audit.py"
      - name: Run market-edge reference review tests
        run: python -m unittest discover -s tests -p "test_market_edge_reference_review.py"
      - name: Run polymarket-skills reference review tests
        run: python -m unittest discover -s tests -p "test_polymarket_skills_reference_review.py"
      - name: Run Trading-Agent-Polymarket reference review tests
        run: python -m unittest discover -s tests -p "test_trading_agent_polymarket_reference_review.py"
      - name: Run PMXT MCP reference review tests
        run: python -m unittest discover -s tests -p "test_pmxt_mcp_reference_review.py"
      - name: Run prediction market MCP tool policy tests
        run: python -m unittest discover -s tests -p "test_prediction_market_mcp_tool_policy.py"

  secret-artifact-audit:
    name: Secret and artifact hygiene audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run secret and artifact hygiene tests
        run: python -m unittest discover -s tests -p "test_secret_artifact_audit.py"
      - name: Run secret and artifact hygiene audit
        run: python scripts/secret_artifact_audit.py
